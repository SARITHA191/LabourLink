<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | LabourLink</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        body {
            background: #FFF8F2;
            color: #352820;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .navbar {
            background: #FFFFFF;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(155, 61, 32, 0.08);
        }

        .brand {
            color: #9B3D20;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-link {
            color: #762D18;
            text-decoration: none;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            background: linear-gradient(120deg, #9B3D20, #E76F32);
            color: white;
            padding: 30px;
            border-radius: 18px;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .page-header p {
            margin: 0;
            line-height: 1.6;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .count {
            background: #FFE7D4;
            color: #9B3D20;
            padding: 8px 13px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
        }

        .read-all {
            background: white;
            color: #9B3D20;
            border: 1px solid #E7B99E;
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .read-all:hover {
            background: #FFF0E5;
        }

        .notification-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .notification-card {
            background: white;
            border: 1px solid #F0DCCF;
            border-radius: 14px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            box-shadow: 0 5px 18px rgba(155, 61, 32, 0.05);
        }

        .notification-card.unread {
            border-left: 5px solid #E76F32;
            background: #FFFCF9;
        }

        .notification-icon {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
            background: #FFE7D4;
            color: #9B3D20;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-message {
            margin: 0 0 10px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .notification-time {
            color: #82756D;
            font-size: 13px;
        }

        .unread-label {
            display: inline-block;
            color: #9B3D20;
            background: #FFE7D4;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .read-label {
            display: inline-block;
            color: #176B42;
            background: #E4F6EB;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .mark-read {
            border: none;
            background: transparent;
            color: #C65322;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 0;
            margin-top: 5px;
        }

        .mark-read:hover {
            text-decoration: underline;
        }

        .empty-state {
            background: white;
            border: 1px dashed #E7B99E;
            border-radius: 16px;
            text-align: center;
            padding: 45px 20px;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .empty-state h2 {
            color: #762D18;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #82756D;
            line-height: 1.6;
        }

        .footer {
            text-align: center;
            margin: 30px 0;
        }

        .footer a {
            color: #9B3D20;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .navbar {
                padding: 16px 5%;
            }

            .container {
                margin-top: 22px;
                padding: 0 14px;
            }

            .page-header {
                padding: 23px 20px;
            }

            .page-header h1 {
                font-size: 25px;
            }

            .notification-card {
                padding: 15px;
                gap: 10px;
            }

            .notification-icon {
                width: 38px;
                height: 38px;
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a class="brand" th:href="@{/}">LabourLink</a>
        <a class="nav-link" th:href="@{/worker/dashboard}">
            ← Dashboard
        </a>
    </nav>

    <main class="container">

        <section class="page-header">
            <div class="header-row">
                <div>
                    <h1>🔔 Notifications</h1>
                    <p>Stay updated with your LabourLink activities.</p>
                </div>

                <span class="count">
                    <span th:text="${unreadCount}">0</span> unread
                </span>
            </div>
        </section>

        <div class="header-row" style="margin-bottom: 20px;" th:if="${!#lists.isEmpty(notifications)}">

            <h2 style="color: #762D18; margin: 0;">
                Recent Updates
            </h2>

            <form th:if="${unreadCount > 0}" th:action="@{/notifications/read-all}" method="post">

                <button class="read-all" type="submit">
                    Mark All as Read
                </button>
            </form>
        </div>

        <section class="notification-list" th:if="${!#lists.isEmpty(notifications)}">

            <article class="notification-card" th:each="notification : ${notifications}"
                th:classappend="${!notification.read} ? ' unread' : ''">

                <div class="notification-icon">🔔</div>

                <div class="notification-content">

                    <span class="unread-label" th:if="${!notification.read}">
                        NEW
                    </span>

                    <span class="read-label" th:if="${notification.read}">
                        READ
                    </span>

                    <p class="notification-message" th:text="${notification.message}">
                        Notification message
                    </p>

                    <div class="notification-time"
                        th:text="${#temporals.format(notification.createdAt, 'dd MMM yyyy, hh:mm a')}">
                        Notification date
                    </div>

                    <form th:if="${!notification.read}" th:action="@{/notifications/{id}/read(id=${notification.id})}"
                        method="post">

                        <button class="mark-read" type="submit">
                            Mark as Read ✓
                        </button>
                    </form>

                </div>
            </article>

        </section>

        <section class="empty-state" th:if="${#lists.isEmpty(notifications)}">

            <div class="empty-icon">🔕</div>

            <h2>You're All Caught Up!</h2>

            <p>
                You don't have any notifications yet.
                We'll keep you updated when something happens.
            </p>

        </section>

        <div class="footer">
            <a th:href="@{/worker/dashboard}">
                Back to Dashboard
            </a>
        </div>

    </main>

</body>

</html>
