<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Employer Registration - LabourLink</title>
</head>

<body>

    <h1>Employer Registration</h1>

    <form th:action="@{/employers/register}" th:object="${employer}" method="post">

        <label>Name:</label>
        <input type="text" th:field="*{name}" required>
        <br><br>

        <label>Phone:</label>
        <input type="text" th:field="*{phone}" required>
        <br><br>

        <label>Location:</label>
        <input type="text" th:field="*{location}" required>
        <br><br>

        <label>Organization / Business Name:</label>
        <input type="text" th:field="*{organizationName}">
        <br><br>

        <button type="submit">Register as Employer</button>

    </form>

    <br>

    <a href="/">Back to Home</a>

</body>

</html>
